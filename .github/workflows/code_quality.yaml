name: Code Quality
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    # Nightly at 3:00 AM UTC
    - cron: '0 3 * * *'
permissions:
  contents: read
jobs:
  lock-file:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
      - run: uv lock --locked --python 3.13
  linting:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: [lock-file]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: uv run ruff check .
  formatting:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: [lock-file]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check formatting with ruff
        run: uv run ruff format --check .
  type-checking:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: [lock-file]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
      # Sync all workspace packages to install dependencies (torch, botorch, etc.)
      - run: uv sync --all-packages
      # Also install bo-mcp-server's `test` extra so ty can resolve
      # `testcontainers` imports in tests/conftest_postgres.py. Without
      # this step the type-check job sees `unresolved-import` for files
      # the slow / postgres test jobs run against, even though those
      # jobs install the extra themselves at execution time. Keeping
      # the type-check env in lockstep with the test env avoids env-
      # conditional `# ty: ignore` directives breaking CI when local
      # developers (who have test extras installed) cannot reproduce
      # the failure with pre-commit.
      - run: uv sync --package bo-mcp-server --extra test --inexact
      # Same lockstep rationale for the optional insights extra (shap):
      # bo_engine.feature_importance and the BayBE insights modules type
      # against the real shap module when it is installed, and the slow /
      # nightly test tiers install the extra — the type-check env must
      # match so ignores added or removed locally reproduce in CI.
      - run: uv sync --package bo-engine-baybe --extra insights --inexact
      - run: uv run ty check
  # bo-agent is intentionally not a uv workspace member. Validate its own
  # lockfile, Python floor, virtual environment, type check, and tests here.
  bo-agent-quality:
    name: BO Agent Quality (py3.12)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup
      - name: Check standalone lockfile
        run: uv lock --project packages/bo-agent --check --python 3.12
      - name: Sync standalone environment
        run: uv sync --project packages/bo-agent --locked --python 3.12
      - name: Type-check bo-agent
        run: >-
          uv run --project packages/bo-agent --locked
          ty check packages/bo-agent
          --project packages/bo-agent
          --python packages/bo-agent/.venv
      - name: Run bo-agent tests
        working-directory: packages/bo-agent
        run: >-
          uv run --locked pytest -v --durations=10
          -m "not integration and not slow and not nightly and not docker and not postgres"
  # =============================================================================
  # Fast Tests (PR Checks) - Run on every push/PR
  # =============================================================================
  # These tests must always pass and run quickly (< 5 min total).
  # The marker expression deselects integration/slow/docker/postgres/nightly
  # suites so the PR gate stays under the 5-minute budget. Integration tests
  # are exercised in a separate matrix below.
  testing-fast:
    name: Fast Tests (${{ matrix.package }}, py${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: [lock-file]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        package: ['bo-engine', 'bo-mcp-server', 'bo-mcp-api', 'bo-engine-baybe']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup
      - run: uv sync --all-packages
      - name: Run fast tests for ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          uv run pytest -v --durations=10 --cov --cov-report=xml \
            -m "not integration and not slow and not nightly and not docker and not postgres" \
            --timeout=60
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.python-version == '3.13' && matrix.package == 'bo-engine'
  # =============================================================================
  # Integration Tests - Run on every push/PR
  # =============================================================================
  # Integration tests (auto-marked via tests/integration/) exercise multi-module
  # flows but exclude infrastructure-dependent docker/postgres suites so the
  # job stays self-contained. They run separately from fast tests so a slow
  # integration failure can't drag the PR gate over budget.
  testing-integration:
    name: Integration Tests (${{ matrix.package }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: [lock-file]
    strategy:
      fail-fast: false
      matrix:
        package: ['bo-mcp-server']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
      - run: uv sync --all-packages
      - name: Run integration tests for ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          uv run pytest -v --durations=20 \
            -m "integration and not slow and not nightly and not docker and not postgres" \
            --timeout=120
  # =============================================================================
  # Docker Stack Tests - containerized consumption against the compose stack
  # =============================================================================
  # Two guards live here. (1) A wheel package-data check: the compose stack
  # bind-mounts the repo and installs editable (docker/dev-entrypoint.sh),
  # so no container test can catch a wheel that omits package data — the
  # unzip-diff step below asserts the built bo-mcp-server wheel ships
  # bo_mcp_server/docs/MANPAGE.md byte-identical to source. (2) pytest -m
  # docker (bo-mcp-server) against the real docker-compose stack (db + api
  # + mcp), asserting from OUTSIDE the containers: manual HTTP/MCP surface
  # behavior, renderer dependencies importable in the API image, the MCP
  # container's HTTP surface serving, and the manual's §2.3 transcript
  # executing end to end.
  testing-docker:
    name: Docker Stack Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: [lock-file]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
      # The test extra provides httpx for the live-stack HTTP assertions.
      - run: uv sync --all-packages --extra test
      - name: Wheel package-data guard (bo-mcp-server)
        # Guard (1): build the wheel and assert the packaged manual is
        # present and byte-identical to the checked-in source. An
        # unzip-diff rather than an isolated install: importing
        # bo_mcp_server pulls the full torch/BayBE dependency chain,
        # which adds gigabytes for no extra signal — the accessor's
        # load path is exercised by every in-process suite already.
        run: |
          uv build --package bo-mcp-server -o dist
          unzip -l dist/bo_mcp_server-*.whl | grep -q "bo_mcp_server/docs/__init__.py"
          unzip -p dist/bo_mcp_server-*.whl "bo_mcp_server/docs/MANPAGE.md" \
            | diff - packages/bo-mcp-server/src/bo_mcp_server/docs/MANPAGE.md
      - name: Prepare compose environment
        # The compose file reads credentials from .env and joins an
        # external network (created by dev-up-bo-mcp locally).
        run: |
          cat > .env <<'ENV'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=bo_mcp
          ENV
          docker network create bo-mcp-network
      - name: Start stack and wait for container health
        # frontend is excluded: the docker suite exercises db + api + mcp;
        # --wait blocks until every started service reports healthy, so
        # MCP readiness is a hard setup precondition, not a test skip.
        run: docker compose up -d --build --wait db api mcp
      - name: Run docker-marked tests
        run: |
          cd packages/bo-mcp-server
          uv run pytest -v --durations=20 -m docker --timeout=120
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down stack
        if: always()
        run: docker compose down -v
  # =============================================================================
  # Slow Tests - Run on main branch pushes only
  # =============================================================================
  # These tests take longer but are required for main branch integrity.
  # Slow includes integration-tier tests by design — once a PR has merged we
  # want the full picture of behavior, not just the under-30s subset.
  testing-slow:
    name: Slow Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: [lock-file, testing-fast, testing-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        package: ['bo-engine', 'bo-mcp-server', 'bo-engine-baybe']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
      - run: uv sync --all-packages
      # The insights extra (shap + numba) powers the SHAP feature-importance
      # tests; installing it here makes the slow-marked real-campaign
      # positive assertion actually execute instead of skipping (the
      # unmarked explainer pin-guard executes in the nightly tier), so
      # BayBE insights-API drift fails CI.
      - name: Install insights extra (bo-engine-baybe)
        if: matrix.package == 'bo-engine-baybe'
        run: uv sync --package bo-engine-baybe --extra insights --inexact
      - name: Run slow tests for ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          uv run pytest -v --durations=20 \
            -m "slow and not nightly and not docker and not postgres" \
            --timeout=300
        # Slow tests may occasionally fail due to stochastic nature
        # We track but don't block merges
        continue-on-error: true
  # =============================================================================
  # Nightly Tests - Comprehensive statistical tests
  # =============================================================================
  # These tests run multiple times with different seeds to catch regressions
  testing-nightly:
    name: Nightly Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: [lock-file]
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        package: ['bo-engine', 'bo-mcp-server', 'bo-engine-baybe']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
      - run: uv sync --all-packages
      # Same rationale as the slow tier: the shap-gated insights tests
      # must execute (not skip) in at least one recurring tier.
      - name: Install insights extra (bo-engine-baybe)
        if: matrix.package == 'bo-engine-baybe'
        run: uv sync --package bo-engine-baybe --extra insights --inexact
      - name: Run comprehensive tests for ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          # Run all tests including nightly (statistical) tests
          uv run pytest -v --durations=30 \
            -m "not docker and not postgres" \
            --timeout=600
      - name: Create nightly test report
        if: always()
        run: |
          echo "## Nightly Test Report - ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This includes slow and statistical tests that verify:" >> $GITHUB_STEP_SUMMARY
          echo "- SAASBO full MCMC convergence" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-objective optimization statistical properties" >> $GITHUB_STEP_SUMMARY
          echo "- TuRBO trust region dynamics" >> $GITHUB_STEP_SUMMARY
  # =============================================================================
  # Nightly tolerance calibration drift gate
  # =============================================================================
  # Re-runs the Monte-Carlo calibration and fails the nightly build when
  # the recommended CI tolerances have drifted past the configured band
  # against the checked-in baseline. A drift means the algorithm or a
  # library bump has changed the variance profile; the next step is to
  # triage the cause and refresh the baseline via `--output`.
  calibration-drift:
    name: Calibration Drift Check
    runs-on: ubuntu-latest
    needs: [lock-file]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
      - run: uv sync --all-packages
      - name: Run calibration drift gate
        run: |
          uv run python scripts/calibrate_test_tolerances.py \
            --iterations 50 \
            --check scripts/test_tolerances_baseline.json
        # The exit code reflects divergence: 0 means the baseline still
        # holds, non-zero means the run breached the drift threshold and
        # the nightly build is red. Operators refresh the baseline by
        # re-running with `--output scripts/test_tolerances_baseline.json`
        # once the cause is triaged.
