repos:
  # uv lock file check
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --locked
        entry: bash -c 'cd backend && uv lock --locked'
        language: system
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

  # Ruff linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]

  # Ruff formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff-format
        types_or: [python, pyi]

  # Pyright type checking
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: bash -c 'cd backend && uv run pyright .'
        language: system
        types: [python]
        pass_filenames: false

  # Trailing whitespace and file endings
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
