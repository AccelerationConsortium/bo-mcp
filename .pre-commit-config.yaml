repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.21
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        entry: uv run --all-packages --extra test ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: ty-bo-agent
        name: ty type checker (bo-agent)
        entry: uv run --project packages/bo-agent ty check packages/bo-agent --project packages/bo-agent --python packages/bo-agent/.venv
        language: system
        files: ^packages/bo-agent/.*\.py$
        pass_filenames: false
      - id: uv-lock-bo-agent
        name: uv lock (bo-agent)
        entry: uv lock --project packages/bo-agent --check
        language: system
        files: ^packages/bo-agent/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
