services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bo-mcp-network
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SQL_ECHO=${SQL_ECHO:-false}
      - BO_MCP_LOG_LEVEL=${BO_MCP_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bo-mcp-network
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    working_dir: /workspace
    command: ["bo-mcp-server", "--transport", "sse", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - .:/workspace
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SQL_ECHO=${SQL_ECHO:-false}
      - BO_BACKEND=${BO_BACKEND:-botorch}
      - BO_MCP_LOG_LEVEL=${BO_MCP_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/sse", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bo-mcp-network
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://api:8000}
    networks:
      - bo-mcp-network
volumes:
  postgres-data:
networks:
  bo-mcp-network:
    # Non-external: created automatically by docker-compose.
    # For multi-stack setups, change to "external: true" and run:
    #   docker network create bo-mcp-network
