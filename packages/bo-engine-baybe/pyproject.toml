[project]
name = "bo-engine-baybe"
version = "0.1.0"
description = "BayBE backend for Bayesian Optimization MCP server"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Willi Gottstein", email = "willi.gottstein@gmail.com" }]
keywords = ["bayesian-optimization", "baybe", "mcp", "multi-backend"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "bo-engine",
    # baybe[chem] pulls in RDKit + scikit-fingerprints (and mordredcommunity
    # for the MORDRED encoding) so SubstanceParameter descriptor tables build
    # out of the box. Pinned exactly: BayBE minor releases ship breaking
    # changes (0.15 changed multi-task kernel composition and the seed API),
    # so upgrades are deliberate, tested bumps of this single pin.
    "baybe[chem]==0.15.0",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
insights = [
    "baybe[insights]==0.15.0",
    # shap's numba dependency needs an explicit modern floor: without it
    # the resolver satisfies numba against the workspace numpy by
    # backtracking to the 2021-era numba 0.53 / llvmlite 0.36 (whose
    # metadata declares no numpy upper bound), which cannot build on
    # Python 3.13 — making this extra uninstallable from the lock and
    # silently disabling SHAP feature importance everywhere the project
    # provisions. The floor forces a numpy/numba pair that actually
    # installs and imports.
    "numba>=0.61.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.entry-points."bo_mcp.backends"]
baybe = "bo_engine_baybe.backend:BayBEBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bo_engine_baybe"]
