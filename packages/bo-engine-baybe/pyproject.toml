[project]
name = "bo-engine-baybe"
version = "0.1.0"
description = "BayBE backend for Bayesian Optimization MCP server"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your@email.com" }]
keywords = ["bayesian-optimization", "baybe", "mcp", "multi-backend"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "bo-engine",
    "baybe>=0.14",
    "pandas>=2.0",
]

[project.optional-dependencies]
insights = [
    "baybe[insights]>=0.14",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.entry-points."bo_mcp.backends"]
baybe = "bo_engine_baybe.backend:BayBEBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bo_engine_baybe"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "C901", "PLR0912", "PLR0915", "PLR0911"]
ignore = ["S101", "N806"]

[tool.ruff.lint.mccabe]
max-complexity = 10
