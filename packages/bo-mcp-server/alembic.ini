# Alembic Configuration for BO-MCP-Server
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts relative to this file
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Truncate long revision identifiers in file names
truncate_slug_length = 40

# Set to 'true' to run migrations offline (generate SQL without connecting)
# offline_mode = false

# Set to the timezone for revision timestamps (UTC recommended)
timezone = UTC

# Version path separator (OS-specific or explicit)
version_path_separator = os

# Database URL - override via environment variable DATABASE_URL
# sqlalchemy.url is set dynamically in env.py from DATABASE_URL
sqlalchemy.url =

[post_write_hooks]
# Hooks for code formatting after migration generation
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
