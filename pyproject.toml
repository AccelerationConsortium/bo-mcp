[project]
name = "bo-mcp-workspace"
version = "0.1.0"
description = "Bayesian Optimization MCP - Monorepo workspace"
requires-python = ">=3.13"
readme = "README.md"

# No direct dependencies - all deps are in packages
dependencies = [
    "plotly>=6.5.2",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15.2",
    "ty>=0.0.26",
    "pre-commit>=3.7",
    "types-seaborn>=0.13.2.20251221",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15.2",
    "ty>=0.0.26",
    "pre-commit>=3.7",
    "types-seaborn>=0.13.2.20251221",
]

[tool.uv.workspace]
members = [
    "packages/bo-engine",
    "packages/bo-engine-baybe",
    "packages/bo-mcp-server",
    "packages/bo-mcp-api",
]

[tool.uv.sources]
bo-engine = { workspace = true }
bo-engine-baybe = { workspace = true }
bo-mcp-server = { workspace = true }
bo-mcp-api = { workspace = true }

# No build-system for workspace root - it's not a package

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes (undefined names, unused imports)
    "I",       # isort (import sorting)
    "N",       # pep8-naming
    "UP",      # pyupgrade (modern Python syntax)
    "B",       # flake8-bugbear (likely bugs)
    "SIM",     # flake8-simplify (simplifiable code patterns)
    "C90",     # mccabe complexity
    "RUF",     # ruff-specific rules
    "NPY",     # numpy-specific rules
    "PT",      # flake8-pytest-style
    "RET",     # flake8-return (return-statement consistency)
    "TRY",     # tryceratops (exception-handling discipline)
    "BLE",     # flake8-blind-except (no bare except / except Exception)
    "ARG",     # flake8-unused-arguments
    "PTH",     # flake8-use-pathlib (prefer pathlib over os.path)
    "PIE",     # flake8-pie (misc small wins)
    "PERF",    # Perflint (performance anti-patterns)
    "D",       # pydocstyle (google convention configured below)
    "ANN",     # flake8-annotations (mandatory type annotations)
    "S",       # flake8-bandit (security)
    "ASYNC",   # flake8-async (sync I/O in async functions)
    "FAST",    # FastAPI-specific rules (deps, response_model)
    "PD",      # pandas-vet (pandas anti-patterns)
    "LOG",     # flake8-logging (logger misuse)
    "G",       # flake8-logging-format (lazy %-formatting in logs)
    "DTZ",     # flake8-datetimez (timezone-aware datetimes)
    "ICN",     # flake8-import-conventions (np, pd, sns aliases)
    "EM",      # flake8-errmsg (extract exception messages to a variable)
    "A",       # flake8-builtins (no shadowing id/type/input)
    "PLR0911", # pylint: too many return statements
    "PLR0912", # pylint: too many branches
    "PLR0915", # pylint: too many statements
]
ignore = [
    "N806",    # X, Y are standard ML variable names
    "SIM300",  # Yoda conditions fight pytest's `actual == pytest.approx(expected)` idiom
    "RUF001",  # ambiguous unicode in strings (false positives on σ, ρ, ≤, Δ, etc.)
    "RUF002",  # ambiguous unicode in docstrings (scientific notation is legitimate)
    "RUF003",  # ambiguous unicode in comments (same)
    "TRY003",  # raise X("msg") wants a custom exception subclass; pedantic for a research lib
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use `assert` (pytest idiom), don't need full docstrings or annotations on every helper.
"tests/**/*.py" = ["S101", "D", "ANN"]
# Demo scripts have long main() functions and minimal docstrings; complexity rules apply to packages only.
"scripts/**" = ["C901", "PLR0912", "PLR0915", "PLR0911", "D", "ANN"]

[tool.ty.environment]
python-version = "3.13"
python = ".venv"
# uv workspace packages live outside site-packages; ty needs explicit paths
extra-paths = [
    "packages/bo-engine/src",
    "packages/bo-engine-baybe/src",
    "packages/bo-mcp-server/src",
    "packages/bo-mcp-api/src",
]

[tool.ty.rules]
# All rules promoted to error. Library-typing limitations are handled
# with targeted `# ty: ignore[rule]` comments on individual lines.
call-non-callable = "error"
invalid-argument-type = "error"
invalid-assignment = "error"
invalid-return-type = "error"
invalid-type-form = "error"
missing-argument = "error"
no-matching-overload = "error"
not-subscriptable = "error"
unknown-argument = "error"
unresolved-attribute = "error"
unresolved-import = "error"
unsupported-operator = "error"

[tool.pytest.ini_options]
# Note: Run tests per-package to avoid conftest.py collisions
# e.g., cd packages/bo-engine && uv run pytest
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120  # 2 minutes per test - prevents CI hangs
xfail_strict = true  # Fail if xfail test unexpectedly passes (catch when features are implemented)
markers = [
    "postgres: marks tests as requiring PostgreSQL (deselect with '-m \"not postgres\"')",
    "slow: marks tests as slow (> 30 seconds), skip in quick CI with '-m \"not slow\"'",
    "smoke: marks tests as smoke tests for critical path, run with '-m smoke'",
    "docker: marks tests as requiring Docker containers (deselect with '-m \"not docker\"')",
    "nightly: marks tests for nightly CI runs only (statistical/stochastic tests)",
    "tutorial: marks tests that reproduce BoTorch tutorial results",
    "deterministic: marks tests that require deterministic torch operations",
    "integration: marks integration tests (auto-applied to tests/ integration/ in bo-mcp-server)",
    "xfail_validation: xfail tests for input validation (roadmap item)",
    "xfail_reproducibility: xfail tests for reproducibility features (roadmap item)",
]
